<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Generatore non-sense</title>
    <link rel="stylesheet" href="/app.css" />
</head>

<body class="bg">
    <main class="container">
        <section class="card">
            <h1 class="title">Generatore non-sense</h1>
            <p class="subtitle">Inserisci una frase di input e scegli se mostrare il Syntactic Tree.</p>

            <div th:if="${error}" class="alert">
                <span th:text="${error}">Errore</span>
            </div>

            <form th:action="@{/nonsense/process}" method="post" class="form">
                <label for="sentence" class="label">Frase in input</label>
                <textarea id="sentence" name="sentence" class="textarea" rows="4"
                    placeholder="Scrivi qui la tua frase..." th:text="${form.sentence}"></textarea>

                <div class="switch-row">
                    <label class="toggle">
                        <input type="checkbox" name="showTree" th:checked="${form.showTree}" />
                        <span class="slider"></span>
                    </label>
                    <span class="switch-label">Mostra Syntactic Tree</span>
                </div>

                <button type="submit" class="btn-primary">Conferma &amp; Genera</button>
            </form>
        </section>

        <footer class="footer">
            <span>GMMS Web UI • Spring Boot + Thymeleaf</span>
        </footer>
    </main>
</body>

<script>
    const textarea = document.getElementById("sentence");
    textarea.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault(); // blocca il newline
            this.form.submit(); // invia il form
        }
    });
</script>

</html>
