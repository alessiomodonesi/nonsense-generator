<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Generatore non-sense</title>
    <link rel="stylesheet" href="/app.css" />
</head>

<body class="bg">
    <!-- Modal errore -->
    <div id="errModal" class="modal" th:classappend="${error} ? ' is-open' : ''" role="dialog" aria-modal="true"
        aria-labelledby="errTitle" aria-hidden="true">
        <div class="modal__backdrop" data-close="true"></div>

        <div class="modal__dialog" role="document" tabindex="-1">
            <div class="modal__header">
                <h2 id="errTitle" class="modal__title">⚠️ Si è verificato un problema</h2>
                <button type="button" class="modal__close" title="Chiudi" aria-label="Chiudi"
                    data-close="true">x</button>
            </div>
            <div class="modal__body">
                <p th:text="${error}">Messaggio di errore</p>
            </div>
            <div class="modal__footer">
                <button type="button" class="btn-primary" data-close="true">OK</button>
            </div>
        </div>
    </div>

    <main class="container">
        <section class="card">
            <h1 class="title">Generatore non-sense</h1>
            <p class="subtitle">Inserisci una frase di input e scegli se mostrare il Syntactic Tree.</p>
            <form th:action="@{/nonsense/process}" method="post" class="form">
                <label for="sentence" class="label">Frase in input</label>
                <textarea id="sentence" name="sentence" class="textarea" rows="4" autofocus
                    placeholder="Scrivi qui la tua frase..." th:text="${form.sentence}"></textarea>

                <!-- Toggle Tree (ON di default) -->
                <button type="button" id="treeToggle" class="toggle-btn" aria-pressed="true" tabindex="-1">
                    <span class="toggle-dot" aria-hidden="true"></span>
                    <span class="toggle-text">Syntactic Tree: ON</span>
                </button>
                <input type="hidden" name="showTree" id="showTreeInput" value="true" />

                <button type="submit" class="btn-primary">Conferma &amp; Genera</button>
            </form>
        </section>

        <footer class="footer">
            <span>GMMS Web UI • Spring Boot + Thymeleaf</span>
        </footer>
    </main>
    <script src="/index.js"></script>
</body>

</html>
